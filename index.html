<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Redaction+35:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <title>Sign Up</title>
</head>
<body>
  <div class="left-panel">
    <p class="app-name">Growth</p>
    <p class="credit">Photo by Alexandru Acea on 
      <a href="https://unsplash.com/photos/pink-petaled-flower-wallpaper-qEXFE5h0e8g ">Unsplash</a></p>
  </div>

  <div class="right-panel">
    <h2 class="description">Sign up to level up your life</h2>
    <form action="#">

      <!-- Name fields -->
      <div class="area">
        <div>
          <label for="fname">First Name</label>
          <input type="text" name="fname" id="fname" required>
        </div>

        <div>
          <label for="lname">Last Name</label>
          <input type="text" name="lname" id="lname" required>
        </div>
      </div>

      <!-- Contact fields -->
      <div class="area">
        <div>
          <label for="email">Email</label>
          <input type="email" name="email" id="email" required>
        </div>

        <div>
          <label for="tel">Phone Number</label>
          <input type="tel" name="tel" id="tel">
        </div>
      </div>

      <!-- Password fields -->
      <div class="area">
        <div>
          <label for="pass">Creaate a Password</label>
          <input type="password" name="password" id="password" required>
        </div>

        <div>
          <label for="cpass">Confirm Password</label>
          <input type="password" name="cpass" id="cpass" required>
        </div>
      </div>

      <!-- Radio field -->
      <fieldset>
        <legend>Subscribe to our newsletter</legend>
        <div class="option">
          <label for="yes">Yes</label>
          <input type="radio" name="radio" id="yes" checked>
        </div>

        <div class="option">
          <label for="no">No</label>
          <input type="radio" name="radio" id="no">
        </div>
      </fieldset>

      <!-- Terms and conditions check box -->
      <input type="checkbox" name="accept" id="tos" required>
      <label for="tos">You have read and accepted our 
        <a href="#">terms and conditions</a></label>

      <button type="submit">Create Account</button>
    </form>
    <p>Already have an account? <a href="#">Sign in</a></p>
  </div>
</body>
</html>
